
name: OpenTrack Windows x64 Full Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  ONNX_VERSION: "1.23.2"

jobs:
  build-windows:
    name: Windows x64 - NeuralNet Enabled
    runs-on: windows-latest

    steps:
      - name: Checkout OpenTrack
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout OpenTrack dependencies
        uses: actions/checkout@v4
        with:
          repository: opentrack/opentrack-depends
          submodules: recursive
          path: opentrack-depends

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCV
        uses: cvpkg/opencv-action@main
        with:
          opencv_tag: "4.x"
          BUILD_LIST: "core,imgcodecs,imgproc,video,videoio,calib3d,highgui,flann,features2d"
          BUILD_SHARED_LIBS: "OFF"
          BUILD_WITH_STATIC_CRT: "OFF"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          dir: "${{ github.workspace }}/qt"
          version: "6.10.3"
          modules: qtserialport qtmultimedia qtimageformats
          target: desktop

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:ONNX_VERSION
          $root = Join-Path $env:GITHUB_WORKSPACE "onnxruntime"
          $package = Join-Path $env:RUNNER_TEMP "onnxruntime.zip"

          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$version/microsoft.ml.onnxruntime.$version.nupkg"

          New-Item -ItemType Directory -Force -Path $root |
            Out-Null

          Invoke-WebRequest -Uri $url -OutFile $package

          Expand-Archive -Path $package `
            -DestinationPath $root -Force

          $include = Join-Path $root "build/native/include/onnxruntime_cxx_api.h"
          $lib = Join-Path $root "runtimes/win-x64/native/onnxruntime.lib"
          $dll = Join-Path $root "runtimes/win-x64/native/onnxruntime.dll"

          foreach ($file in @($include, $lib, $dll)) {
            if (!(Test-Path $file)) {
              throw "Missing ONNX Runtime file: $file"
            }
          }

          "ONNXRuntime_DIR=$root" >> $env:GITHUB_ENV

          Write-Host "ONNX Runtime installed successfully."

      - name: Configure CMake
        shell: cmd
        run: >
          .github\workflows\build-windows.bat cmake
          -G Ninja
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}\build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
          -DQt6_DIR="${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6"
          -DONNXRuntime_DIR="${{ env.ONNXRuntime_DIR }}"

      - name: Verify ONNX Runtime configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:GITHUB_WORKSPACE "build/CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt not found."
          }

          $content = Get-Content $cache -Raw

          foreach ($name in @(
            "ONNXRuntime_LIBRARY",
            "ONNXRuntime_RUNTIME",
            "ONNXRuntime_INCLUDE_DIR"
          )) {
            $pattern = "(?m)^${name}:[^=]*=(.*)$"
            $match = [regex]::Match($content, $pattern)

            if (!$match.Success) {
              throw "Missing CMake dependency entry: ${name}"
            }

            $value = $match.Groups[1].Value.Trim()

            if (!$value -or $value -match "NOTFOUND") {
              throw "Dependency not found: ${name} = $value"
            }

            Write-Host "${name} = $value"
          }

          Write-Host "ONNX Runtime verification PASSED."

      - name: Build and install OpenTrack
        shell: cmd
        run: >
          .github\workflows\build-windows.bat cmake
          --build "${{ github.workspace }}\build"
          --config Release
          --target install
          --parallel 4

      - name: Verify NeuralNet and application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"

          if (!(Test-Path $stage)) {
            throw "Install directory missing: $stage"
          }

          $files = @(Get-ChildItem $stage -Recurse -File)

          $exe = $files |
            Where-Object { $_.Name -eq "opentrack.exe" } |
            Select-Object -First 1

          if (!$exe) {
            throw "opentrack.exe is missing."
          }

          $neural = $files |
            Where-Object {
              $_.Name -match "neuralnet.*\.dll$"
            } |
            Select-Object -First 1

          if (!$neural) {
            throw "NeuralNet tracker DLL is missing. Check OpenCV and OpenMP detection in CMake logs."
          }

          $onnx = $files |
            Where-Object {
              $_.Name -eq "onnxruntime.dll"
            } |
            Select-Object -First 1

          if (!$onnx) {
            throw "ONNX Runtime DLL is missing."
          }

          $models = @(
            $files | Where-Object {
              $_.Extension -eq ".onnx"
            }
          )

          if ($models.Count -lt 5) {
            throw "NeuralNet model files missing. Found $($models.Count), expected at least 5."
          }

          Write-Host "Application: $($exe.FullName)"
          Write-Host "NeuralNet: $($neural.FullName)"
          Write-Host "ONNX Runtime: $($onnx.FullName)"
          Write-Host "Model files: $($models.Count)"

          Write-Host "NeuralNet build files verified successfully."

      - name: List installed DLL plugins
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"

          Get-ChildItem $stage -Recurse -Filter "*.dll" -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"
          $zip = Join-Path $env:GITHUB_WORKSPACE "opentrack-windows-x64-full.zip"

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zip)) {
            throw "ZIP packaging failed."
          }

          Write-Host "Created: $zip"
          Write-Host "Size: $((Get-Item $zip).Length) bytes"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-windows-x64-full
          path: opentrack-windows-x64-full.zip
          if-no-files-found: error
          retention-days: 30
