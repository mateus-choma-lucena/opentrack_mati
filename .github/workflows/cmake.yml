
name: OpenTrack Windows x64 Full Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  ONNX_VERSION: "1.23.2"

jobs:
  build-windows:
    name: Windows x64 - NeuralNet Enabled
    runs-on: windows-latest

    steps:
      - name: Checkout OpenTrack
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout OpenTrack dependencies
        uses: actions/checkout@v4
        with:
          repository: opentrack/opentrack-depends
          ref: 25d146b0575391712d2160617c6059db3e2d352c
          submodules: recursive
          path: opentrack-depends

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCV
        shell: pwsh
        run: tools/install-opencv.ps1 -Destination "${{ github.workspace }}/.deps/opencv"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          dir: "${{ github.workspace }}/qt"
          version: "6.10.3"
          modules: qtserialport qtmultimedia qtimageformats
          target: desktop

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:ONNX_VERSION
          $root = Join-Path $env:GITHUB_WORKSPACE "onnxruntime"
          $package = Join-Path $env:RUNNER_TEMP "onnxruntime.zip"

          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$version/microsoft.ml.onnxruntime.$version.nupkg"

          New-Item -ItemType Directory -Force -Path $root |
            Out-Null

          Invoke-WebRequest -Uri $url -OutFile $package

          Expand-Archive -Path $package `
            -DestinationPath $root -Force

          $include = Join-Path $root "build/native/include/onnxruntime_cxx_api.h"
          $lib = Join-Path $root "runtimes/win-x64/native/onnxruntime.lib"
          $dll = Join-Path $root "runtimes/win-x64/native/onnxruntime.dll"

          foreach ($file in @($include, $lib, $dll)) {
            if (!(Test-Path $file)) {
              throw "Missing ONNX Runtime file: $file"
            }
          }

          "ONNXRuntime_DIR=$root" >> $env:GITHUB_ENV

          Write-Host "ONNX Runtime installed successfully."

      - name: Verify OpenCV development dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Join-Path $env:OpenCV_DIR "OpenCVConfig.cmake"
          if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "OpenCVConfig.cmake is missing at '$config'. Rerun the Install OpenCV step and inspect its download/extraction log."
          }
          .github/workflows/build-windows.bat cmake -G Ninja -S cmake/verify-opencv -B build/opencv-check -DCMAKE_BUILD_TYPE=Release "-DOpenCV_DIR=$env:OpenCV_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "OpenCV SDK verification failed: check the MSVC x64 environment, required components, headers, import libraries, and runtime DLLs in the preceding CMake log."
          }

      - name: Configure CMake
        shell: cmd
        run: >
          .github\workflows\build-windows.bat cmake
          -G Ninja
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}\build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
          -DQt6_DIR="${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6"
          -DOpenCV_DIR="${{ env.OpenCV_DIR }}"
          -DSDK_LIBUSB="${{ github.workspace }}/opentrack-depends/libusb-msvc-2026-md"
          -DONNXRuntime_DIR="${{ env.ONNXRuntime_DIR }}"
          -DOPENTRACK_REQUIRE_NEURALNET=ON
          -DBUILD_TESTING=ON

      - name: Verify ONNX Runtime configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:GITHUB_WORKSPACE "build/CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt not found."
          }

          $content = Get-Content $cache -Raw

          foreach ($name in @(
            "ONNXRuntime_LIBRARY",
            "ONNXRuntime_RUNTIME",
            "ONNXRuntime_INCLUDE_DIR"
          )) {
            $pattern = "(?m)^${name}:[^=]*=(.*)$"
            $match = [regex]::Match($content, $pattern)

            if (!$match.Success) {
              throw "Missing CMake dependency entry: ${name}"
            }

            $value = $match.Groups[1].Value.Trim()

            if (!$value -or $value -match "NOTFOUND") {
              throw "Dependency not found: ${name} = $value"
            }

            Write-Host "${name} = $value"
          }

          Write-Host "ONNX Runtime verification PASSED."

      - name: Build and install OpenTrack
        shell: cmd
        run: |
          if not exist "${{ github.workspace }}\stage" mkdir "${{ github.workspace }}\stage"
          if errorlevel 1 exit /b %ERRORLEVEL%
          .github\workflows\build-windows.bat cmake --build "${{ github.workspace }}\build" --config Release --target install --parallel 4

      - name: Verify NeuralNet and application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"

          if (!(Test-Path $stage)) {
            throw "Install directory missing: $stage"
          }

          $files = @(Get-ChildItem $stage -Recurse -File)

          $exe = $files |
            Where-Object { $_.Name -eq "opentrack.exe" } |
            Select-Object -First 1

          if (!$exe) {
            throw "opentrack.exe is missing."
          }

          $neural = $files |
            Where-Object {
              $_.Name -match "neuralnet.*\.dll$"
            } |
            Select-Object -First 1

          if (!$neural) {
            throw "NeuralNet tracker DLL is missing. Check OpenCV and OpenMP detection in CMake logs."
          }

          $onnxPath = Join-Path $exe.DirectoryName "modules/onnxruntime.dll"
          if (!(Test-Path -LiteralPath $onnxPath)) {
            throw "ONNX Runtime must be installed at modules/onnxruntime.dll, as required by the NeuralNet loader."
          }
          $onnx = Get-Item -LiteralPath $onnxPath

          $models = @(
            $files | Where-Object {
              $_.Extension -eq ".onnx"
            }
          )

          if ($models.Count -lt 5) {
            throw "NeuralNet model files missing. Found $($models.Count), expected at least 5."
          }

          Write-Host "Application: $($exe.FullName)"
          Write-Host "NeuralNet: $($neural.FullName)"
          Write-Host "ONNX Runtime: $($onnx.FullName)"
          Write-Host "Model files: $($models.Count)"

          Write-Host "NeuralNet build files verified successfully."

      - name: Run Enhanced automated tests
        shell: cmd
        run: >
          .github\workflows\build-windows.bat ctest
          --test-dir "${{ github.workspace }}\build"
          -C Release
          --output-on-failure
          --output-junit "${{ github.workspace }}\build\enhanced-tests.xml"

      - name: Validate runtime package
        shell: pwsh
        run: tools/verify-package.ps1 -Stage "${{ github.workspace }}/stage"

      - name: Upload automated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-test-results
          path: build/enhanced-tests.xml
          if-no-files-found: warn

      - name: List installed DLL plugins
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"

          Get-ChildItem $stage -Recurse -Filter "*.dll" -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"
          $zip = Join-Path $env:GITHUB_WORKSPACE "opentrack-enhanced-windows-x64.zip"

          tools/package-windows.ps1 -Stage $stage -Destination $zip

          if (!(Test-Path $zip)) {
            throw "ZIP packaging failed."
          }

          Write-Host "Created: $zip"
          Write-Host "Size: $((Get-Item $zip).Length) bytes"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-enhanced-windows-x64
          path: opentrack-enhanced-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
