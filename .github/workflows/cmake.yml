
name: OpenTrack Windows x64 Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout OpenTrack
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout OpenTrack dependencies
        uses: actions/checkout@v4
        with:
          repository: opentrack/opentrack-depends
          submodules: recursive
          path: opentrack-depends

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCV
        uses: cvpkg/opencv-action@main
        with:
          opencv_tag: '4.x'
          BUILD_LIST: 'core,imgcodecs,imgproc,video,videoio,calib3d,highgui'
          BUILD_SHARED_LIBS: 'OFF'
          BUILD_WITH_STATIC_CRT: 'OFF'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          dir: "${{ github.workspace }}/qt"
          version: '6.10.3'
          modules: qtserialport qtmultimedia qtimageformats
          target: desktop

      - name: Configure CMake
        shell: cmd
        run: >
          .github\workflows\build-windows.bat cmake
          -GNinja
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}\build"
          -DCMAKE_BUILD_TYPE=Release
          -DQt6_DIR="${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6"
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build and install
        shell: cmd
        run: >
          .github\workflows\build-windows.bat cmake
          --build "${{ github.workspace }}\build"
          --config Release
          --target install

      - name: Verify build output
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"

          if (!(Test-Path $stage)) {
            throw "Install directory not found: $stage"
          }

          Get-ChildItem $stage -Recurse -File |
            Select-Object -ExpandProperty FullName

          $exe = Get-ChildItem $stage -Recurse `
            -Filter "opentrack.exe" -File |
            Select-Object -First 1

          if (!$exe) {
            throw "opentrack.exe was not found"
          }

          Write-Host "Found executable: $($exe.FullName)"

      - name: Package Windows build
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"
          $zip = Join-Path $env:GITHUB_WORKSPACE "opentrack-windows-x64.zip"

          Compress-Archive -Path "$stage\*" `
            -DestinationPath $zip -Force

          Write-Host "Created $zip"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-windows-x64
          path: opentrack-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
